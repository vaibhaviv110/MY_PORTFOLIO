<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMDEMO</title>
</head>

<body>
    <table border="2" align="center" cellpadding="20" width="90%" style="border-color: black;">
        <tr>
            <td>
                <h1 align="center"> Job Application Form</h1>

                <form>
                    <table border="3" cellpadding="10" align="center" style="border-color: black;">
                        <tr>
                            <td><b>Full Name:</b></td>
                            <td> <input type="text" placeholder="Enter Your Name"></td>
                        </tr>
                        <tr>
                            <td><b>Email address:</b></td>
                            <td> <input type="email"></td>
                        </tr>
                        <tr>
                            <td><b>Phone Number:</b></td>
                            <td> <input type="tel" placeholder="123-456-7890" [0-9]{10}></td>
                        </tr>
                        <tr>
                            <td><b>Gender:</b></td>
                            <td><input type="radio" name="gender">male <input type="radio" name="gender">female</td>
                        </tr>
                        <tr>
                            <td><b>Job Role:</b></td>
                            <td>
                                <select>
                                    <option>--Select Role--</option>
                                    <option>Web Developer</option>
                                    <option>UI/UX</option>
                                    <option>Cyber Security</option>
                                    <option>Ai/ML</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><b>Date Of Birth </b></td>
                            <td><input type="date"></td>
                        </tr>
                        <tr>
                            <td><b>Favorite color</b></td>
                            <td><input type="color"></td>
                        </tr>
                        <tr>
                            <td><b>Upload Resume</b></td>
                            <td><input type="file"></td>
                        </tr>
                        <tr>
                            <td><b>Skills</b></td>
                            <td>
                                <input type="checkbox">HTML
                                 <input type="checkbox">CSS
                                  <input type="checkbox">REACT
                                   <input type="checkbox">JS
                            </td>
                        </tr>
                        <tr>
                            <td><b>Cover Letter</b></td>
                            <td>
                                <textarea placeholder="write somthing about yourself..."> </textarea>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="submit">
                                <input type="reset" value="reset">
                            </td>
                        </tr>
                    </table>
            </td>
        </tr>

        </td>
        </tr>

    </table>
    </form>




















</body>

</html>
