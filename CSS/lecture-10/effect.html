<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>effect</title>
    <link rel="stylesheet" href="effect.css">
</head>

<body>
    <div class="header">
        <h2>Multi-Effect UI Showcase </h2>
        <p>All section styled without Flexbox</p>
    </div>
    <div class="main">
        <div class="heading">
            <h2>Layered Profile Cards</h2>
        </div>
        <div class="box1">
            <img src="./i1.jpg" alt="">
            <h2>Alice</h2>
            <p>UI/UX Designer</p>
        </div>
        <div class="box2">
            <img src="./im2.png" alt="">
            <h2>Bob</h2>
            <p>Web Developer</p>
        </div>
        <div class="heading">
            <h2>Quiz Flashcards</h2>
        </div>
        <div class="card-3">
            <div class="flip-box">
                <div class="flip-box-inner">
                    <div class="flip-box-front">
                        <h2>What is HTML?</h2>
                    </div>
                    <div class="flip-box-back">
                        <h2>Hyper text markup language</h2>
                    </div>
                </div>
            </div>
            <div class="flip-box">
                <div class="flip-box-inner">
                    <div class="flip-box-front">
                        <h2>What is CSS?</h2>
                    </div>
                    <div class="flip-box-back">
                        <h2>cascading style sheet</h2>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <div class="heading">
                <h2>Creative Buttons</h2>
            </div>
            <div>
                <button class="btn1">Slide Button</button>
                <button class="btn2">Glow Button</button>
            </div>

        </div>
        <div class="image">
            <div class="heading">
                <h2>Interactive Image Gallery</h2>
            </div>
            <img src="./p1.webp" alt="">
            <img src="./p2.jpg" alt="">
            <img src="./p3.jpeg" alt="">
        </div>
    </div>



</body>

</html>
