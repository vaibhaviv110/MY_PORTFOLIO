<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C++ Programming Projects</title>

    <!-- Bootstrap CSS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: rgb(22, 36, 67);
            color: white;
        }

        /* ================= HEADER ================= */

        .hero {
            background: linear-gradient(135deg, #153154, #4f92df);
            color: white;
            padding: 20px 50px;
            text-align: center;
        }

        .hero-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 45px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #e5e7eb;
        }

        /* ================= PROJECT SECTION ================= */

        .projects-section {
            padding: 70px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 32px;
            font-weight: 700;
            color: #24292f;
        }

        .section-title p {
            color: #666;
            margin-top: 10px;
        }

        /* ================= CARD ================= */

        .project-card {
            background: transparent;
            border: 1px solid blue;
            border-radius: 18px;
            padding: 35px 25px;
            height: 100%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            text-align: center;
            color: white;
        }

        .project-card:hover {
            border-color: #00c6ff;
            transform: translateY(-8px);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.4);
        }

        /* ICON */

        .project-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef4ff;
            color: #0969da;
            border-radius: 50%;
            font-size: 32px;
            transition: 0.3s;
        }

        .project-card:hover .project-icon {
            background: #0969da;
            color: white;
        }

        .project-card h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;

        }

        .project-card p {
            color: #666;
            line-height: 1.6;
            min-height: 75px;
        }

        /* BUTTON */

        .project-btn {
            display: inline-block;
            margin-top: 15px;
            background: #498ada;
            color: white;
            padding: 11px 22px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .project-btn:hover {
            background: #0969da;
            color: white;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #24292f;
            color: white;
            text-align: center;
            padding: 25px 15px;
            margin-top: 20px;
        }

        footer p {
            margin: 0;
            color: #d0d7de;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {

            .hero {
                padding: 60px 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 16px;
            }

        }
    </style>

</head>

<body>


    <!-- ================= HERO ================= -->

    <section class="hero">
        <div class="container">
            <div class="hero-icon">
                <i class="bi bi-code-slash"></i>
            </div>
            <h1>C++ Programming Projects</h1>
            <p>
                My C++ Programming Practice Programs
            </p>
            <a href="../index.html" class="btn btn-primary" style="right:20px">
                <i class="fa-solid fa-circle-arrow-left"></i> Back to Home
            </a>
        </div>
    </section>

    <!-- ================= PROJECTS ================= -->

    <section class="projects-section">
        <div class="container text-light">
            <div class="section-title">
                <h2 class="text-light">My Projects</h2>
                <p class="text-light">
                    Select a category to view all programs
                </p>
            </div>
            <div class="row g-4">
                <!-- C++ programs -->
                <div class="col-lg-6 col-md-6">
                    <div class="project-card">
                        <div class="project-icon">
                            <i class="bi bi-code-slash"></i>
                        </div>
                        <h2>
                            Time Converter Program
                        </h2>
                        <h3>
                            Project-1
                        </h3>
                        <a href="./timeconvert/project1.html" class="project-btn">
                            Open Programs
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>

                </div>
                <!-- railway system-->

                <div class="col-lg-6 col-md-6">
                    <div class="project-card">
                        <div class="project-icon">
                            <i class="fa-solid fa-train-subway"></i>
                        </div>
                        <h2>
                            Railway Reservation Syatem
                        </h2>
                        <h3>
                            Project-2
                        </h3>
                        <a href="./Railway Reservation System/project2.html" class="project-btn">
                            Open Programs
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>

                </div>

            </div>
    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="text-center  text-light p-3" style="background-color: #043978;">

        <p>
            © 2026 C++ Programming Projects | GitHub Pages
        </p>

    </footer>

</body>

</html>
