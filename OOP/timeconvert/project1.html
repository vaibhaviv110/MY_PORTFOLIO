<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C Programs</title>

    <!-- Bootstrap CSS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: rgb(22, 36, 67);
            color: white;
        }


        /*  HEADER  */

        header {
            background: linear-gradient(135deg, #153154, #4f92df);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        header .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
            color: #d0d7de;
        }


        /* MAIN  */

        .main-section {
            padding: 60px 0;
        }


        /*  BACK BUTTON  */

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #6a8bb4;
            padding: 10px 18px;
            border-radius: 7px;
            margin-bottom: 35px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #1070de;
            color: white;
        }

        /*  TITLE  */
        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 32px;
            font-weight: 700;

        }

        .section-title p {
            color: #666;
            margin-top: 8px;
        }

        /*  PROGRAM CARD  */
        .program-card {
            background: transparent;
            text-align: center;
            border: 1px solid blue;
            border-radius: 18px;
            padding: 35px 25px;
            height: 100%;
            transition: all 0.3s ease;
        }

        .program-card:hover {
            border-color: #00c6ff;
            transform: translateY(-8px);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.4);
        }

        /*  PROGRAM ICON  */
        .program-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef4ff;
            color: #0969da;
            border-radius: 50%;
            font-size: 28px;
            margin: 0 auto 20px auto;
            transition: 0.3s;
        }

        .program-card:hover .program-icon {
            background: #0969da;
            color: white;
        }

        /*  CARD TEXT  */
        .program-card h3 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .program-card p {
            color: #666;
            line-height: 1.6;
            min-height: 75px;
        }

        /* BUTTON  */

        .btn-program {
            display: inline-block;
            text-decoration: none;
            background: #5984b8;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-program:hover {
            background: #0969da;
            color: white;
        }


        /*  VIDEO  */

        .recording-section {
            margin-top: 70px;
            text-align: center;
        }

        .recording-section h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .recording-section video {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }


        /*  FOOTER  */

        footer {
             background: linear-gradient(135deg, #153154, #4f92df);
            color: white;
            text-align: center;
            padding: 22px 15px;
            margin-top: 50px;
        }

        footer p {
            margin: 0;
            color: #d0d7de;
        }


        /*  MOBILE  */

        @media (max-width: 768px) {

            header {
                padding: 45px 20px;
            }

            header h1 {
                font-size: 32px;
            }

            .section-title h2 {
                font-size: 27px;
            }

        }
    </style>
</head>


<body>


    <!-- ===== HEADER ===== -->

    <header>

        <div class="icon">
            <i class="bi bi-arrow-repeat"></i>
        </div>

        <h1>C Programs</h1>

        <p>
            My C Programming Practice Programs
        </p>

    </header>



    <!-- =====MAIN SECTION===== -->

    <section class="main-section">

        <div class="container">


            <!-- BACK BUTTON -->

            <a href="./project1.html" class="back-btn">

                <i class="bi bi-arrow-left"></i>
                Back to Projects
            </a>
            <!-- TITLE -->

            <div class="section-title">
                <h2>My Programs</h2>
                <p>
                    Select a program to view the C++ source code
                </p>
            </div>
            <!-- ==== PROGRAM CARDS ===== -->
            <center>
                <div>
                    <!-- time converter -->
                    <div class="">
                        <div class="program-card">
                            <div class="program-icon">
                                <i class="bi bi-code-slash"></i>
                            </div>
                            <h3>
                                Time Converter
                            </h3>

                            <a href="./timeconvert.cpp" class="btn-program">
                                View Program
                                <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                    </div>
            </center>

            <!-- ==== RECORDING====== -->
            <div class="recording-section">
                <h2>
                    🎥  Program Screen Recording
                </h2>
                <video controls>
                    <source src="./Timeconverter.webm" type="video/webm">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </section>
    <!-- ====FOOTER === -->
    <footer>
        <p>
            © 2026 C Programming Projects | GitHub Pages
        </p>
    </footer>
    
    
</body>

</html>
